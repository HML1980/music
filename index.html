<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>音樂播放器</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: Arial, sans-serif; background: #1a1a2e; color: #fff; padding: 20px; }
        h1 { text-align: center; margin-bottom: 20px; font-size: 1.5rem; }
        
        .controls { display: flex; flex-wrap: wrap; gap: 10px; margin-bottom: 15px; }
        select { flex: 1; min-width: 120px; padding: 10px; border-radius: 5px; border: none; font-size: 1rem; }
        
        .options { display: flex; gap: 20px; margin-bottom: 15px; font-size: 0.9rem; }
        .options label { display: flex; align-items: center; gap: 5px; cursor: pointer; }
        
        button { width: 100%; padding: 12px; background: #00b4d8; border: none; border-radius: 5px; color: #fff; font-size: 1rem; cursor: pointer; margin-bottom: 15px; }
        button:hover { background: #0096c7; }
        button:disabled { background: #555; cursor: wait; }
        
        .player { background: #000; border-radius: 8px; overflow: hidden; margin-bottom: 15px; }
        .video-container { position: relative; padding-top: 56.25%; }
        .video-container iframe { position: absolute; top: 0; left: 0; width: 100%; height: 100%; }
        
        .now-playing { padding: 10px; background: #16213e; border-radius: 5px; margin-bottom: 10px; font-size: 0.9rem; }
        .now-playing span { color: #00b4d8; }
        
        .btns { display: flex; gap: 10px; margin-bottom: 15px; }
        .btns button { flex: 1; margin: 0; padding: 10px; font-size: 0.9rem; }
        .btns button.on { background: #e63946; }
        
        .playlist { background: #16213e; border-radius: 8px; max-height: 300px; overflow-y: auto; }
        .song { padding: 10px 15px; cursor: pointer; border-bottom: 1px solid #1a1a2e; display: flex; justify-content: space-between; }
        .song:hover { background: #1a1a2e; }
        .song.active { background: #00b4d8; color: #000; }
        .song-title { flex: 1; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; margin-right: 10px; }
        
        .msg { text-align: center; padding: 20px; color: #888; }
    </style>
</head>
<body>
    <h1>🎵 音樂播放器</h1>

    <div class="controls">
        <select id="decade">
            <option value="1960s">1960年代</option>
            <option value="1970s">1970年代</option>
            <option value="1980s">1980年代</option>
            <option value="1990s">1990年代</option>
            <option value="2000s">2000年代</option>
            <option value="2010s">2010年代</option>
            <option value="2020s" selected>2020年代</option>
        </select>
        <select id="region">
            <option value="western">西洋</option>
            <option value="chinese" selected>華語</option>
            <option value="korean">韓國</option>
            <option value="japanese">日本</option>
            <option value="latin">拉丁</option>
        </select>
        <select id="genre">
            <option value="ballad" selected>抒情</option>
            <option value="dance">舞曲</option>
            <option value="rock">搖滾</option>
            <option value="rnb">R&B</option>
            <option value="hiphop">嘻哈</option>
            <option value="electronic">電子</option>
        </select>
    </div>

    <div class="options">
        <label><input type="checkbox" id="autoplay" checked> 自動播放</label>
        <label><input type="checkbox" id="filterShort" checked> 排除3分鐘以下</label>
    </div>

    <button id="searchBtn" onclick="search()">搜尋</button>

    <div class="player">
        <div class="video-container"><div id="player"></div></div>
    </div>

    <div class="now-playing" id="nowPlaying" style="display:none">
        <span>播放中：</span><span id="title">-</span>
    </div>

    <div class="btns">
        <button onclick="prev()">⏮ 上一首</button>
        <button onclick="next()">下一首 ⏭</button>
        <button id="repeatBtn" onclick="toggleRepeat()">🔁 重複</button>
    </div>

    <div class="playlist" id="playlist">
        <div class="msg">點擊「搜尋」開始</div>
    </div>

    <script>
        const API_KEY = 'AIzaSyB7mfrH_M6fvSUWgCjtxQYCK_r83xA0t9E';
        let player, list = [], idx = -1, repeat = false, ready = false;

        const terms = {
            decade: { '1960s':'60s', '1970s':'70s', '1980s':'80s', '1990s':'90s', '2000s':'2000s', '2010s':'2010s', '2020s':'2020s' },
            region: { western:'english', chinese:'華語 中文', korean:'kpop', japanese:'jpop', latin:'latin' },
            genre: { ballad:'ballad 抒情', dance:'dance', rock:'rock', rnb:'r&b', hiphop:'hip hop', electronic:'edm' }
        };

        // Load YouTube API
        const tag = document.createElement('script');
        tag.src = 'https://www.youtube.com/iframe_api';
        document.head.appendChild(tag);

        function onYouTubeIframeAPIReady() {
            player = new YT.Player('player', {
                playerVars: { playsinline:1, rel:0 },
                events: { onReady: () => ready = true, onStateChange: e => { if(e.data === 0) repeat ? player.seekTo(0) && player.playVideo() : next(); }}
            });
        }

        async function search() {
            const q = `${terms.decade[decade.value]} ${terms.region[region.value]} ${terms.genre[genre.value]} music`;
            const btn = document.getElementById('searchBtn');
            btn.disabled = true; btn.textContent = '搜尋中...';

            try {
                const r1 = await fetch(`https://www.googleapis.com/youtube/v3/search?part=snippet&q=${encodeURIComponent(q)}&type=video&videoCategoryId=10&maxResults=20&key=${API_KEY}`);
                const d1 = await r1.json();
                if(d1.error) throw new Error(d1.error.message);

                const ids = d1.items.map(i => i.id.videoId).join(',');
                const r2 = await fetch(`https://www.googleapis.com/youtube/v3/videos?part=contentDetails,snippet&id=${ids}&key=${API_KEY}`);
                const d2 = await r2.json();

                list = d2.items.map(i => ({
                    id: i.id,
                    title: i.snippet.title,
                    dur: parseDur(i.contentDetails.duration)
                })).filter(v => !filterShort.checked || v.dur >= 180);

                if(!list.length) { playlist.innerHTML = '<div class="msg">無結果，試試關閉「排除3分鐘以下」</div>'; return; }

                render();
                if(autoplay.checked) play(0);
            } catch(e) {
                playlist.innerHTML = `<div class="msg" style="color:#e63946">錯誤: ${e.message}</div>`;
            } finally {
                btn.disabled = false; btn.textContent = '搜尋';
            }
        }

        function parseDur(d) {
            const m = d.match(/PT(?:(\d+)H)?(?:(\d+)M)?(?:(\d+)S)?/);
            return (~~m[1])*3600 + (~~m[2])*60 + (~~m[3]);
        }

        function fmtDur(s) { return `${~~(s/60)}:${String(s%60).padStart(2,'0')}`; }

        function render() {
            playlist.innerHTML = list.map((v,i) => 
                `<div class="song ${i===idx?'active':''}" onclick="play(${i})">
                    <span class="song-title">${v.title}</span>
                    <span>${fmtDur(v.dur)}</span>
                </div>`
            ).join('');
        }

        function play(i) {
            if(!ready || i < 0 || i >= list.length) return;
            idx = i;
            player.loadVideoById(list[i].id);
            document.getElementById('title').textContent = list[i].title;
            document.getElementById('nowPlaying').style.display = 'block';
            render();
        }

        function next() { if(list.length) play((idx+1) % list.length); }
        function prev() { if(list.length) play(idx <= 0 ? list.length-1 : idx-1); }
        function toggleRepeat() { repeat = !repeat; document.getElementById('repeatBtn').classList.toggle('on', repeat); }
    </script>
</body>
</html>
